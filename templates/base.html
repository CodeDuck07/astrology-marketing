<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Astrology Admin{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f4f5;
      color: #18181b;
      line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 20px;
    }
    .msg-ok {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .msg-err {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e4e4e7;
      vertical-align: top;
    }
    th { font-size: 0.85rem; color: #71717a; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font: inherit;
    }
    textarea { min-height: 320px; resize: vertical; }
    .meta { color: #71717a; font-size: 0.9rem; margin-bottom: 16px; }
    .meta span { margin-right: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
